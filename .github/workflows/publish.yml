name: Publish verified Android update
on:
  push:
    paths: ['incoming/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Verify APK hash, version and pinned certificate
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path('.');j=json.loads((root/'incoming/latest.json').read_text())
          apk=root/'incoming/financial-companion.apk'
          assert apk.stat().st_size==j['size']
          assert hashlib.file_digest(apk.open('rb'),'sha256').hexdigest()==j['sha256']
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])
          tools=sorted((sdk/'build-tools').glob('*'),key=lambda p:tuple(int(n) for n in re.findall(r'\d+',p.name)))[-1]
          cert=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(apk)],text=True)
          digest=re.search(r'certificate SHA-256 digest: ([a-f0-9]+)',cert)[1]
          assert digest==(root/'signing-certificate.sha256').read_text().strip()==j['certificateSha256']
          b=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(apk)],text=True)
          assert 'application-debuggable' not in b,'Debug APKs are not release updates'
          package=re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",b)
          assert package[1]==j['packageName']=='ru.naparnik.finance'
          assert int(package[2])==j['versionCode'] and package[3]==j['versionName']
          assert j['apkUrl']==f"https://github.com/Jlapb-code/financial-companion-updates/releases/download/v{package[3]}/financial-companion.apk"
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('RELEASE_TAG=v'+j['versionName']+'\n')
          (root/'release-notes.txt').write_text(j.get('releaseNotes',''))
          PY
      - name: Create immutable public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Its assets are immutable; increase versionCode and versionName for a new update."
          else
            gh release create "$RELEASE_TAG" incoming/financial-companion.apk incoming/latest.json --title "Финансовый напарник $RELEASE_TAG" --notes-file release-notes.txt --latest
          fi
